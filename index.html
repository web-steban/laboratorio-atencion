<script>
//#LOGIC-START
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let mem=LS('la_v4',[]),trn=LS('la_trn4',[]),foc=LS('la_foc4',null),note=LS('la_note',''),pid=LS('la_pid',null)||('P-'+Math.random().toString(36).slice(2,6).toUpperCase()),DEMO=false,DM=[],DFOC=null,DTRN=[];
SV('la_pid',pid);

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function saveFile(name,txt){try{if(typeof claude!=='undefined'){const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:txt});return}}}catch(e){if(e&&e.code==='declined')return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=name;a.click()}
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):NaN};
const zq=p=>{const q=p<.5?p:1-p,t=Math.sqrt(-2*Math.log(q)),x=t-(2.515517+.802853*t+.010328*t*t)/(1+1.432788*t+.189269*t*t+.001308*t*t*t);return p<.5?-x:x};
const r=(x,d=0)=>(typeof x==='number'&&isFinite(x))?x.toFixed(d):'–',clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x)),sgn=(x,d=2)=>(typeof x==='number'&&isFinite(x))?(x>=0?'+':'')+x.toFixed(d):'–';
const av2=(L,f)=>{const x=L.map(f).filter(v=>typeof v==='number'&&isFinite(v));return x.length?mean(x):NaN};
const fdt=ts=>{const d=new Date(ts);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'})+' · '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})};
const bs=h=>h<12?'Mañana':h<18?'Tarde':'Noche',T=s=>new Date(s.ts).getTime(),fd=d=>new Date(d).toLocaleDateString('es',{day:'numeric',month:'short'});
const wkey=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getTime()};
const tt=a=>{const n=a.length;if(n<3)return NaN;const m=mean(a),s=sd(a);return s===0?(m===0?0:m>0?Infinity:-Infinity):m/(s/Math.sqrt(n))};
// ---- analizadores de cada juego (reciben los ensayos registrados) ----
function GM(tr,hid){const g=tr.filter(t=>t.type==='go'),n=tr.filter(t=>t.type==='no'),an=g.filter(t=>t.rt!=null&&t.rt<150).length,gv=g.filter(t=>!(t.rt!=null&&t.rt<150)),hits=gv.filter(t=>t.rt!=null),omN=gv.length-hits.length,cN=n.filter(t=>t.rt!=null).length,rts=hits.map(t=>t.rt),H=(hits.length+.5)/(gv.length+1),F=(cN+.5)/(n.length+1);
const m={nGo:g.length,nNo:n.length,hits:hits.length,omN,om:gv.length?omN/gv.length*100:100,commN:cN,comm:cN/n.length*100,anN:an,rt:rts.length?mean(rts):NaN,rtm:med(rts),sd:sd(rts),cv:rts.length>1?sd(rts)/mean(rts):NaN,dp:zq(H)-zq(F),c:-(zq(H)+zq(F))/2};
m.ok=!hid&&an/g.length<=.1&&m.om<=50&&m.comm<=80&&hits.length>=Math.max(4,gv.length*.5)&&isFinite(m.cv);return m}
function SM(tr,hid){const C=tr.filter(t=>t.con),I=tr.filter(t=>!t.con),ok=L=>L.filter(t=>t.ok),mr=L=>{const x=ok(L).map(t=>t.rt);return x.length?mean(x):NaN};
const m={nC:C.length,nI:I.length,accC:ok(C).length/C.length*100,accI:ok(I).length/I.length*100,errC:C.length-ok(C).length,errI:I.length-ok(I).length,rtC:mr(C),rtI:mr(I)};m.int=m.rtI-m.rtC;
m.ok=!hid&&(ok(C).length+ok(I).length)/tr.length>=.6&&ok(C).length>=2&&ok(I).length>=2&&isFinite(m.int);return m}
function NM(tr,n,hid){const S=tr.filter(t=>t.scored),T=S.filter(t=>t.tgt),NT=S.filter(t=>!t.tgt),hits=T.filter(t=>t.resp).length,fa=NT.filter(t=>t.resp).length,rts=T.filter(t=>t.resp).map(t=>t.rt),H=(hits+.5)/(T.length+1),F=(fa+.5)/(NT.length+1),rr=(hits+fa)/S.length;
return{n,scored:S.length,nT:T.length,nNT:NT.length,hits,fa,omN:T.length-hits,cr:NT.length-fa,rt:rts.length?mean(rts):NaN,acc:(hits+NT.length-fa)/S.length*100,dp:zq(H)-zq(F),ok:!hid&&rr>=.05&&rr<=.9&&T.length>0}}
function CM(tr,hid){const bl=[0,1,2].map(b=>{const L=tr.filter(t=>t.blk===b),T=L.filter(t=>t.tgt),NT=L.filter(t=>!t.tgt),h=T.filter(t=>t.resp),rs=h.map(t=>t.rt);return{nT:T.length,hits:h.length,omN:T.length-h.length,commN:NT.filter(t=>t.resp).length,nNT:NT.length,rt:rs.length?mean(rs):NaN}});
const T=tr.filter(t=>t.tgt),NT=tr.filter(t=>!t.tgt),h=T.filter(t=>t.resp),rs=h.map(t=>t.rt),hits=h.length,fa=NT.filter(t=>t.resp).length,H=(hits+.5)/(T.length+1),F=(fa+.5)/(NT.length+1);
const m={blocks:bl,nT:T.length,nNT:NT.length,hits,omN:T.length-hits,om:(T.length-hits)/T.length*100,commN:fa,comm:fa/NT.length*100,rt:rs.length?mean(rs):NaN,sd:sd(rs),cv:rs.length>1?sd(rs)/mean(rs):NaN,dp:zq(H)-zq(F)};
m.dOm=bl[2].omN-bl[0].omN;m.dComm=bl[2].commN-bl[0].commN;m.dRt=bl[2].rt-bl[0].rt;m.ok=!hid&&m.om<=80&&m.comm<=80&&hits>=1;return m}
function RM(rts,early,hid){const v=rts.filter(x=>x!=null&&x>=150),ant=rts.filter(x=>x!=null&&x<150).length+early,none=rts.filter(x=>x==null).length;
return{n:rts.length,rt:v.length?mean(v):NaN,med:med(v),sd:sd(v),cv:v.length>1?sd(v)/mean(v):NaN,ant,none,ok:!hid&&v.length>=Math.min(5,Math.ceil(rts.length*.6))&&v.length>1}}
function nbSeq(n,N){const L='BFKMPRST'.split(''),k=Math.round((N-n)*.3),c=[];for(let i=n;i<N;i++)c.push(i);for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}
const tg=new Set(c.slice(0,k)),seq=[];for(let i=0;i<N;i++){if(tg.has(i))seq.push(seq[i-n]);else{let ch;do{ch=L[Math.floor(Math.random()*L.length)]}while(i>=n&&ch===seq[i-n]);seq.push(ch)}}return{seq,tg}}

const gOk=s=>[s.gng.clean.m.ok&&s.gng.dist.m.ok,s.st.m.ok,s.nb.n1.m.ok&&s.nb.n2.m.ok,s.cpt.m.ok,s.rt.m.ok];

inh:{n:'Respiración lenta',min:2,br:1,d:'Inhala 4 segundos y exhala 6 siguiendo el círculo. Úsala antes de una tarea en la que debas frenar impulsos, como responder mensajes o un examen.'},

const INFO={sost:{def:'Capacidad de mantener la atención en una tarea durante un periodo prolongado.',ej:'Seguir una clase completa, leer varias páginas seguidas, conducir sin distraerse.',juego:'CPT (prueba de ejecución continua): aparecen letras una a una y se toca solo cuando aparece la X. Son tres bloques seguidos; se compara cómo cambian omisiones, comisiones y velocidad entre el primero y el último.',tema:'¿Te cuesta mantener la atención en tareas largas o poco interesantes? ¿Se te va la mente a mitad de una clase o lectura?'},
inh:{def:'Capacidad de frenar una respuesta automática o impulsiva cuando no corresponde.',ej:'Esperar tu turno para hablar, no contestar un mensaje al instante, no comprar por impulso.',juego:'Go/No-Go: se toca el círculo azul y no el cuadrado naranja. Las comisiones (tocar el naranja) muestran respuestas que no se alcanzaron a frenar.',tema:'¿Te pasa que actúas o respondes antes de pensar? ¿En qué situaciones?'},

const TX=()=>PV?[]:DEMO?DTRN:trn,FC=()=>PV?null:DEMO?DFOC:foc,D=()=>PV?PV.sessions.filter(s=>s.valid):DEMO?DM:mem.filter(s=>s.valid);
const P=s=>({inh:s.gng.clean.m.ok?s.gng.clean.m.comm:NaN,mem:s.nb.n2.m.ok?s.nb.n2.m.dp:NaN,sel:s.st.m.ok?s.st.m.int:NaN,sost:s.cpt.m.ok?s.cpt.m.dp:NaN,vel:s.rt.m.ok?s.rt.m.med:NaN});

function zs(V){const st=FN.map(f=>{const x=V.map(s=>P(s)[f.k]).filter(isFinite);return x.length>=4&&sd(x)>0?{m:mean(x),s:sd(x)}:null});return V.map(s=>FN.map((f,i)=>{const v=P(s)[f.k];return st[i]&&isFinite(v)?f.d*(v-st[i].m)/st[i].s:NaN}))}
